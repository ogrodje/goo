name: Build && Publish

on:
  push: { branches: [ "master" ] }
  pull_request: { branches: [ "master" ] }
  # The merge queue builds and tests each PR on top of the PRs ahead of it (refs/heads/gh-readonly-queue/…), so
  # publishing and deploying, which need refs/heads/master, still happen only after the merge.
  merge_group: { types: [ checks_requested ] }

# Master builds publish and deploy, so they take turns: two merged at once raced (2026-11-11), and the one that
# finished last published its image over the other's. PR builds of the same branch replace each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KUBECONFIG: ogrodje-one-config
  POSTGRES_DB: goo
  POSTGRES_PORT: 5433
  POSTGRES_HOST: localhost
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_USER: goo
  DISCORD_EVENTS_WEBHOOK: ${{ secrets.DISCORD_EVENTS_WEBHOOK }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: shimataro/ssh-key-action@v2
        with:
          known_hosts: unnecessary
          key: ${{ secrets.SSH_KEY }}
          name: id_ogrodje_goo
          config: |
            Host ogrodje-one
              User oto
              Hostname ogrodje-one.ogrodje.si
              IdentityFile ~/.ssh/id_ogrodje_goo
              StrictHostKeyChecking no
              ConnectTimeout 60
              ConnectionAttempts 2
              AddKeysToAgent yes
          if_key_exists: fail

      - uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - run: docker compose -p goo -f docker/docker-compose.yml up pg -d

      - run: sbt "test"

      # Every PR builds the image too, so a broken image is caught before it reaches master.
      - name: Build image
        run: sbt "Docker/publishLocal"

      # Java, the Playwright driver and the image's Chromium (with its system libraries) all have to work:
      # Playwright's own CLI launches Chromium and takes a screenshot inside the image.
      - name: Smoke-test image
        run: |
          docker run --rm --entrypoint java ghcr.io/ogrodje/goo:latest \
            -cp '/opt/docker/lib/*' com.microsoft.playwright.CLI \
            screenshot --browser chromium 'data:text/html,<h1>goo</h1>' /tmp/smoke.png

      - name: Publish image
        if: ${{ github.ref == 'refs/heads/master' }}
        run: sbt "Docker/publish"

      - name: Install yq v4
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: "Deploy"
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          OGRODJE_ONE_CONFIG: ${{ secrets.OGRODJE_ONE_CONFIG }}
        run: |
          # Write kubeconfig file first
          echo "$OGRODJE_ONE_CONFIG" > ogrodje-one-config
          export KUBECONFIG=ogrodje-one-config
          
          # Refresh version
          ./bin/refresh-version.sh
          
          ssh -o "ExitOnForwardFailure yes" \
            -o "ServerAliveInterval 60" \
            -o "ServerAliveCountMax 5" \
            -o "StrictHostKeyChecking no" \
            -o "UserKnownHostsFile /dev/null" \
            -N \
            -L 16443:localhost:16443 oto@ogrodje-one &
          
          sleep 5
          
          # Verify kubeconfig content and server address
          echo "Checking kubeconfig settings..."
          kubectl config view --minify | grep server

          echo "Applying k8s,..."
          kubectl apply -k k8s/base
