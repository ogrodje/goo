apiVersion: apps/v1
kind: Deployment
metadata:
  name: goo
  namespace: goo-prod
  labels: { app: goo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: goo }
  template:
    metadata:
      labels: { app: goo }
    spec:
      containers:
        - name: goo
          image: ghcr.io/ogrodje/goo:0.1.26
          args: [ "server", "--start" ]
          ports: [ { containerPort: 7777 }, { containerPort: 7778 } ]
          env:
            - { name: GOO_ENVIRONMENT, value: "Production" }
            - { name: PORT, value: "7777" }
            - { name: OTEL_TRACES_EXPORTER, value: "none" }
            - { name: OTEL_METRICS_EXPORTER, value: "none" }
            - { name: OTEL_LOGS_EXPORTER, value: "none" }
            - { name: POSTGRES_DB, value: "goo" }
            - { name: POSTGRES_HOST, value: "main-cluster-rw.pg.svc.cluster.local" }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_USER, value: "goo" }
            - { name: SOURCES, value: "All" }
            - { name: KEYCLOAK_ENDPOINT, value: "https://keycloak.ogrodje.si" }
            - { name: KEYCLOAK_REALM, value: "Ogrodje" }
            # Without it, the heap may grow to a quarter of the node's memory (3.9 GB); production's used at most
            # 272 MB of it, typically 121 MB (Prometheus, 10 days to 2026-10-28)
            - { name: JAVA_OPTS, value: "-Xmx512m" }
            - name: SENTRY_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: goo-secret, key: sentry_auth_token }
            - name: HYGRAPH_ENDPOINT
              valueFrom:
                secretKeyRef: { name: goo-secret, key: hygraph_endpoint }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: main-cluster-goo, key: password }
          # Production: ~1.2 GB between syncs (the JVM ~940 MB, Playwright's driver and Chromium ~320 MB), more while
          # the events sync runs Chromium for Eventbrite. At 1280Mi it ran at its limit, so the kernel kept dropping
          # the pages of the JVM's and Chromium's own files and reading them back, ~500 MB/s from the node's disk for
          # each 17-minute sync (NodeMemoryMajorPagesFaults, OG-50).
          resources:
            limits:
              memory: "2Gi"
            requests:
              cpu: "50m"
              memory: "1280Mi"
          volumeMounts:
            - name: playwright-cache
              mountPath: /root/.cache/ms-playwright
          livenessProbe:
            httpGet:
              path: /
              port: 7777
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 7777
            initialDelaySeconds: 20
            periodSeconds: 50

      volumes:
        - name: playwright-cache
          persistentVolumeClaim:
            claimName: playwright-cache-pvc
